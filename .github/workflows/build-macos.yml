name: Build macOS arm64

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          brew install cmake ninja pkgconf c-ares glib libgcrypt libxml2 pcre2 \
            qtbase qtsvg qttools gnutls libssh lua lz4 snappy zstd xxhash \
            libnghttp2 libnghttp3 libmaxminddb
          python -m pip install pytest pytest-xdist

      - name: Configure
        run: |
          qt_prefixes="$(brew --prefix qtbase);$(brew --prefix qtsvg);$(brew --prefix qttools)"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_PREFIX_PATH="$qt_prefixes;$(brew --prefix libxml2);$(brew --prefix)" \
            -DQT_ADDITIONAL_PACKAGES_PREFIX_PATH="$qt_prefixes" \
            -DBUILD_wireshark=ON -DBUILD_tshark=ON -DBUILD_dftest=ON \
            -DBUILD_sharkd=OFF -DBUILD_stratoshark=OFF -DENABLE_SPARKLE=OFF

      - name: Build application and test programs
        run: cmake --build build --parallel 3 --target all test-programs

      - name: Test columns and display filters
        working-directory: build
        run: >-
          python -m pytest -q ../test/suite_dfilter ../test/suite_unittests.py::TestUnitTests ../test/suite_translation.py
          ../test/suite_follow.py ../test/suite_follow_dccp.py ../test/suite_follow_multistream.py
          --disable-capture --disable-gui --junitxml=test-results.xml

      - name: Verify Follow Stream uses a single scan
        shell: bash
        run: |
          # The driver reuses the GUI's library paths; keep it out of the app archive.
          trap 'rm -f build/run/Wireshark.app/Contents/MacOS/follow_stream_filter_test' EXIT
          python test/qt/run_follow_stream_filter_test.py --build-dir build 2>&1 | tee build/follow-stream-filter-test.log

      - name: Test packet comparison and item-view rendering
        shell: bash
        run: |
          cmake -S test/qt -B build/qt-tests -G Ninja -DCMAKE_PREFIX_PATH="$(brew --prefix qtbase)"
          cmake --build build/qt-tests --parallel 3
          ctest --test-dir build/qt-tests --output-on-failure
          trap 'rm -f build/run/Wireshark.app/Contents/MacOS/packet_comparison_integration' EXIT
          python test/qt/run_packet_comparison_test.py --build-dir build --large-source --language zh_CN --theme light --screenshot-dir build/comparison-light 2>&1 | tee build/packet-comparison-test.log
          QT_QPA_PLATFORM=cocoa python test/qt/run_packet_comparison_test.py --build-dir build --no-build --pcapng --language zh_CN --theme dark --screenshot-dir build/comparison-dark 2>&1 | tee -a build/packet-comparison-test.log

      - name: Verify live Follow Stream with real pipe capture
        shell: bash
        run: |
          trap 'rm -f build/run/Wireshark.app/Contents/MacOS/follow_stream_live_test' EXIT
          python test/qt/run_follow_stream_live_test.py --build-dir build --limits 2>&1 | tee build/follow-stream-live-test.log
          QT_QPA_PLATFORM=cocoa python test/qt/run_follow_stream_live_test.py --build-dir build --no-build --language zh_CN --theme dark --screenshot-dir build/follow-live-dark 2>&1 | tee -a build/follow-stream-live-test.log

      - name: Verify analysis sessions and persistent bookmarks
        shell: bash
        run: |
          trap 'rm -f build/run/Wireshark.app/Contents/MacOS/analysis_session_integration' EXIT
          python test/qt/run_analysis_session_test.py --build-dir build 2>&1 | tee build/analysis-session-test.log
          QT_QPA_PLATFORM=cocoa python test/qt/run_analysis_session_test.py --build-dir build --no-build --language zh_CN --screenshot-dir build/analysis-session-ui 2>&1 | tee -a build/analysis-session-test.log

      - name: Bundle dependencies
        run: LIBPREFIX="$(brew --prefix)" cmake --build build --parallel 3 --target wireshark_app_bundle

      - name: Sign, verify, and package application
        run: |
          # macdeployqt includes Cocoa; keep the small offscreen plugin for GUI smoke tests.
          install -m 755 "$(brew --prefix qtbase)/share/qt/plugins/platforms/libqoffscreen.dylib" \
            build/run/Wireshark.app/Contents/PlugIns/platforms/
          python .github/scripts/package-macos.py build/run/Wireshark.app dist

      - name: Upload application
        uses: actions/upload-artifact@v6
        with:
          name: macos-arm64
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: macos-arm64-diagnostics
          path: |
            build/test-results.xml
            build/follow-stream-filter-test.log
            build/follow-stream-live-test.log
            build/analysis-session-test.log
            build/analysis-session-ui/*.png
            build/follow-live-dark/*.png
            build/packet-comparison-test.log
            build/comparison-light/*.png
            build/comparison-dark/*.png
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7
